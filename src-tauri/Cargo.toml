[package]
name = "phenoblendtk"
version = "0.4.1"
description = "Phenoblend Toolkit"
authors = ["Peter N Robinson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "phenoblendtk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
dirs = "6.0"
ontolius = "0.8.1" 
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
rfd = { version = "0.16.0", default-features = false}
fenominal = { git = 'https://github.com/P2GX/fenominal.git',  tag = '0.3.4' , features = ["serde"] }
#fenominal = { path = '../../fenominal',features = ["serde"] }
#ga4ghphetools = { git = 'https://github.com/P2GX/ga4ghphetools.git', features= ["tauri"], tag = '0.7.11' }
ga4ghphetools = { path = "../../ga4ghphetools", features= ["tauri"] }
#oboannotation = "0.2.0"
oboannotation = { path = "../../oboannotation" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.152"
toml = "0.9.8"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2.5.2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
regex = "1.12.3"
tauri-plugin-shell = "2.5.0"

thiserror = "2.0.18"
csv = "1.4.0"
phenopackets = "0.2.2-post2"
itertools = "0.15.0"
svg2pdf = "0.13"
rust_xlsxwriter = "0.99"
log = "0.4"
tauri-plugin-log = "2"
statrs = "0.19"
rand = "0.10"
uuid = { version = "1.28", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] } # Optional, if you want rich date/time handling


[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.16.0", default-features = false, features = ["xdg-portal", "tokio"] }
# rfd buggy with version 0.17.2: package `phenoboard` depends on `rfd` with feature `tokio` but `rfd` does not have that feature.




[profile.dev.package."*"]
cap-lints = "allow"

[profile.release.package."*"]
cap-lints = "allow"

[dev-dependencies]
flate2 = "1.1.9"
rstest = "0.27.0"


