<div class="home-page">
    
    <div class="home-header">
        <img src="assets/icon.png" alt="Phenoblend Logo" class="home-header__logo" />
        
        <div class="home-header__titles">
            <h1 class="home-header__h1">
                <span class="home-header__h1--accent">Phenoblend</span>
            </h1>
            <p class="home-header__subtitle">Visualize phenotype blending in individuals with multiple genetic diagnoses.</p>
        </div>
    </div>

    <div class="home-card">
        
        <div class="home-card__section">
            <h2 class="home-card__section-label">HPO Setup</h2>
            <ui-load-ontology
                label="HPO"
                [isLoading]="statusService.hpoLoading()"
                [isLoaded]="statusService.hpoLoaded()"
                [statusMessage]="hpoMessage()"
                [termCount]="statusService.nHpoTerms()"
                helpUrl="https://p2gx.github.io/phenoblend/tutorial/data.html"
                [helpLines]="['Select the local hp.json file from your machine.']"
                (onLoad)="loadHpo()">
                </ui-load-ontology>
        </div>

         <div class="home-card__section">
            <h2 class="home-card__section-label">HPOAs Setup</h2>
            <ui-load-ontology
                label="HPOA"
                [isLoading]="statusService.hpoaLoading()"
                [isLoaded]="statusService.hpoaLoaded()"
                [statusMessage]="hpoaMessage()"
                [termCount]="statusService.nHpoaDisease()"
                helpUrl="https://p2gx.github.io/phenoblend/tutorial/data.html"
                [helpLines]="['Select the local phenotype.hpoa file from your machine.']"
                (onLoad)="loadHpoas()">
            </ui-load-ontology>
        </div>

        <div class="home-card__section">
            <h2 class="home-card__section-label">gene-to-disease.txt file</h2>
               <ui-load-ontology
                label="Gene to Disease file"
                [isLoading]="statusService.g2dLoading()"
                [isLoaded]="statusService.g2dLoaded()"
                [statusMessage]="g2dMessage()"
                [termCount]="statusService.nGenes()"
                helpUrl="https://p2gx.github.io/phenoblend/tutorial/data.html"
                [helpLines]="['Select the local gene-to-disease.txt file from your machine.']"
                (onLoad)="loadGeneToDisease()">
            </ui-load-ontology>
        </div> 
    </div>

    <div class="home-card__footer-action">
        <button class="primary-action-btn" (click)=proceedToDataEntryWindow() >
        <span>Enter HPO data</span>
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
        </button>
    </div>
</div>
